name: gooo-two-generation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  verify-self-hosting-slice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.x'
          cache: true
      - name: Prepare caller-owned evidence directory
        run: mkdir -p "$RUNNER_TEMP/gooo-two-generation/artifacts"
      - name: Compile all Go packages
        id: compile
        continue-on-error: true
        run: |
          set +e
          start=$(date +%s%3N)
          /usr/bin/time -f '%M' -o "$RUNNER_TEMP/gooo-two-generation/compile.rss" go build ./...
          status=$?
          end=$(date +%s%3N)
          printf '%s %s\n' "$((end - start))" "$(cat "$RUNNER_TEMP/gooo-two-generation/compile.rss")" > "$RUNNER_TEMP/gooo-two-generation/compile.time"
          exit "$status"
      - name: Build trusted and verifier executors
        id: build
        continue-on-error: true
        run: |
          set +e
          start=$(date +%s%3N)
          /usr/bin/time -f '%M' -o "$RUNNER_TEMP/gooo-two-generation/build.rss" sh -c 'go build -o "$RUNNER_TEMP/gooo-two-generation/gooo-selfhost" ./cmd/gooo-selfhost && go build -o "$RUNNER_TEMP/gooo-two-generation/gooo-verify" ./cmd/gooo-verify'
          status=$?
          end=$(date +%s%3N)
          printf '%s %s\n' "$((end - start))" "$(cat "$RUNNER_TEMP/gooo-two-generation/build.rss")" > "$RUNNER_TEMP/gooo-two-generation/build.time"
          exit "$status"
      - name: Run Go tests with exact counters
        id: tests
        continue-on-error: true
        run: |
          set +e
          start=$(date +%s%3N)
          /usr/bin/time -f '%M' -o "$RUNNER_TEMP/gooo-two-generation/test.rss" sh -c 'go test -json -count=1 ./... > "$RUNNER_TEMP/gooo-two-generation/go-test.json"'
          status=$?
          end=$(date +%s%3N)
          printf '%s %s\n' "$((end - start))" "$(cat "$RUNNER_TEMP/gooo-two-generation/test.rss")" > "$RUNNER_TEMP/gooo-two-generation/test.time"
          exit "$status"
      - name: Check parser behavior corpus
        id: conformance
        continue-on-error: true
        run: |
          set +e
          start=$(date +%s%3N)
          /usr/bin/time -f '%M' -o "$RUNNER_TEMP/gooo-two-generation/conformance.rss" "$RUNNER_TEMP/gooo-two-generation/gooo-selfhost" conformance \
            --meta .gooo/two-generation.gooo \
            --repo-root "$GITHUB_WORKSPACE" \
            --output "$RUNNER_TEMP/gooo-two-generation/artifacts/conformance.json"
          status=$?
          end=$(date +%s%3N)
          printf '%s %s\n' "$((end - start))" "$(cat "$RUNNER_TEMP/gooo-two-generation/conformance.rss")" > "$RUNNER_TEMP/gooo-two-generation/conformance.time"
          exit "$status"
      - name: Run stage0, compile stage1, and run stage1 on the same input
        id: integration
        continue-on-error: true
        run: |
          set +e
          start=$(date +%s%3N)
          work="$RUNNER_TEMP/gooo-two-generation"
          max_rss=0
          run_step() {
            label=$1
            shift
            /usr/bin/time -f '%M' -o "$work/$label.rss" "$@"
            step_status=$?
            step_rss=$(cat "$work/$label.rss" 2>/dev/null || printf '0')
            if [ "$step_rss" -gt "$max_rss" ] 2>/dev/null; then max_rss=$step_rss; fi
            return "$step_status"
          }
          run_step stage0 "$work/gooo-selfhost" generate \
            --meta .gooo/two-generation.gooo \
            --input examples/self-input.gooo \
            --repo-root "$GITHUB_WORKSPACE" \
            --output-dir "$work/artifacts/stage1"
          status=$?
          if [ "$status" -eq 0 ]; then
            run_step stage1-build go build -o "$work/stage1-executor" "$work/artifacts/stage1/stage1.go"
            status=$?
          fi
          if [ "$status" -eq 0 ]; then
            run_step stage1-run "$work/stage1-executor" \
              --input "$GITHUB_WORKSPACE/examples/self-input.gooo" \
              --repo-root "$GITHUB_WORKSPACE" \
              --output-dir "$work/artifacts/stage2"
            status=$?
          fi
          if [ "$status" -eq 0 ]; then
            run_step compare "$work/gooo-selfhost" compare \
              --meta .gooo/two-generation.gooo \
              --stage1-dir "$work/artifacts/stage1" \
              --stage2-dir "$work/artifacts/stage2" \
              --output "$work/artifacts/fixed-point.json"
            status=$?
          fi
          end=$(date +%s%3N)
          printf '%s %s\n' "$((end - start))" "$max_rss" > "$work/integration.time"
          exit "$status"
      - name: Verify inherited bootstrap conformance
        id: bootstrap
        continue-on-error: true
        run: |
          "$RUNNER_TEMP/gooo-two-generation/gooo-verify" conformance \
            --contract .gooo/bootstrap.gooo \
            --input-digest "sha256:$GITHUB_SHA" \
            --target "$GITHUB_REPOSITORY" \
            --repo-root "$GITHUB_WORKSPACE" \
            --output "$RUNNER_TEMP/gooo-two-generation/artifacts/bootstrap-conformance.json"
      - name: Observe PR-only policy without inventing unavailable evidence
        id: policy
        continue-on-error: true
        run: |
          "$RUNNER_TEMP/gooo-two-generation/gooo-verify" verify \
            --contract .gooo/bootstrap.gooo \
            --input-digest "sha256:$GITHUB_SHA" \
            --observe-github \
            --repo "$GITHUB_REPOSITORY" \
            --event "$GITHUB_EVENT_NAME" \
            --ref "$GITHUB_REF" \
            --sha "$GITHUB_SHA" \
            --before "$GITHUB_EVENT_BEFORE" \
            --allow-unknown \
            --output "$RUNNER_TEMP/gooo-two-generation/artifacts/policy.json"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Write exact evidence dossier
        if: always()
        continue-on-error: true
        run: |
          work="$RUNNER_TEMP/gooo-two-generation"
          "$GITHUB_WORKSPACE/scripts/write-selfhost-evidence.sh" \
            "$GITHUB_WORKSPACE" \
            "$work" \
            "$work/selfhost-evidence.json" \
            "$work/compile.time" \
            "$work/build.time" \
            "$work/test.time" \
            "$work/conformance.time" \
            "$work/integration.time" \
            "$work/go-test.json"
      - name: Upload immutable CI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gooo-two-generation-evidence
          path: |
            ${{ runner.temp }}/gooo-two-generation/selfhost-evidence.json
            ${{ runner.temp }}/gooo-two-generation/go-test.json
            ${{ runner.temp }}/gooo-two-generation/artifacts/**
          if-no-files-found: error
      - name: Enforce self-hosting slice gates
        if: always()
        run: |
          test "${{ steps.compile.outcome }}" = success
          test "${{ steps.build.outcome }}" = success
          test "${{ steps.tests.outcome }}" = success
          test "${{ steps.conformance.outcome }}" = success
          test "${{ steps.integration.outcome }}" = success
          test "${{ steps.bootstrap.outcome }}" = success
